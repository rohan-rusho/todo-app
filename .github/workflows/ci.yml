name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          fail=0
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$f" || fail=1
          done
          exit $fail
      - name: Check pages exist
        run: test -f index.html
